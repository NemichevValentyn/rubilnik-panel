<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#d8d4ce" />
  <title>Щиток — Rubilnik</title>
  <link rel="stylesheet" href="css/panel.css?v=7" />
</head>
<body>
  <div id="lock-screen" class="lock-screen">
    <div class="lock-card">
      <h1>Доступ лише через QR</h1>
      <p>Відскануй QR‑код біля щитка квартири. Без нього сторінка не відкривається.</p>
    </div>
  </div>

  <div class="panel-app" id="panel-app" hidden>
    <canvas id="panel-canvas" aria-label="3D модель електричного щитка"></canvas>
    <div class="panel-hud">
      <div class="panel-top">
        <div class="panel-brand" id="panel-title">Щиток квартири</div>
        <div class="panel-hint" id="panel-hint">Завантаження…</div>
      </div>
      <div class="info-card" id="info-card" hidden>
        <div class="info-head">
          <div>
            <h2 class="info-title" id="info-title"></h2>
            <p class="info-label" id="info-label"></p>
          </div>
          <button type="button" class="info-close" id="btn-close-info" aria-label="Закрити">×</button>
        </div>
        <p class="info-desc" id="info-desc"></p>
      </div>
      <div class="panel-actions">
        <button type="button" class="panel-btn panel-btn-primary" id="btn-toggle-door">Відкрити дверцята</button>
        <button type="button" class="panel-btn" id="btn-reset-view">Скинути вид</button>
        <a class="panel-link" id="link-qr" href="#">QR‑код</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/panel/main.js?v=7"></script>
</body>
</html>
